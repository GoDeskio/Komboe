name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sender, backup, and update checks
        run: |
          set -eu
          python3 tests/features/smtp_from.py
          python3 tests/features/backup_restore.py
          python3 tests/features/self_update.py
          python3 tests/features/coolify_pull.py
          python3 tests/features/email_interval.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Extension trust token is revoked from session storage
        run: node --experimental-strip-types tests/features/email_trust_storage.mjs
      - name: Login-name eligibility matches the server wrap rule
        run: node --experimental-strip-types tests/features/login_name_eligibility.mjs
      - name: Validate the pull-only compose file
        env:
          KOMBOE_SERVER_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          KOMBOE_CLIENTS_DIGEST: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          ADMIN_TOKEN: ci-admin-token
          SMTP_PASSWORD: ci-smtp-password
        run: |
          set -eu
          out=$(docker compose -f deploy/coolify/docker-compose.pull.yml config)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -F "ghcr.io/godeskio/komboe-server@sha256:${KOMBOE_SERVER_DIGEST}"
          printf '%s\n' "$out" | grep -F "ghcr.io/godeskio/komboe-clients@sha256:${KOMBOE_CLIENTS_DIGEST}"
          printf '%s\n' "$out" | grep -F "donotreply@komboe.com"
          if printf '%s\n' "$out" | grep -Eq '^[[:space:]]*build:'; then
            echo "pull compose rendered a build block" >&2
            exit 1
          fi

  marketing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/upstream
      - name: Server unit tests
        working-directory: server/upstream
        run: cargo test --features sqlite --bin vaultwarden -- never_and_window codes_expire email_is_not login_name_shape login_name_uses a_miss_is_stable restore_replaces
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: apps/web-marketing
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web-marketing
      - run: bash e2e/run.sh
        working-directory: apps/web-marketing
        env:
          CARGO_BUILD_JOBS: "2"
      - name: Timed email sign-in against the built server and a local mail sink
        run: python3 tests/features/email_interval_flow.py
      - name: Marketing sign-in keeps mixed-case salts and lowercased accounts
        run: node tests/features/marketing_email_case.mjs
      - name: New migrations apply on boot and survive a second boot
        run: python3 tests/features/migrations_boot.py
      - name: Signed-in vault, downloads page, and PIN enroll/unlock/failure
        run: node tests/features/ui_proof.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-screenshots
          path: apps/web-marketing/e2e/screenshots/*

  angular-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/upstream
      - name: Build the server the vault test logs into
        working-directory: server/upstream
        run: cargo build --features sqlite --bin vaultwarden
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the web vault dependencies
        working-directory: clients/upstream
        run: |
          set -eu
          npm install -g npm@11.6.2
          npm ci --ignore-scripts
      - name: Build the self-hosted web vault
        working-directory: clients/upstream
        env:
          NODE_OPTIONS: --max-old-space-size=5120
        run: npm run dist:oss:selfhost --workspace @bitwarden/web-vault
      - name: Install Playwright
        working-directory: apps/web-marketing
        run: |
          set -eu
          npm ci
          npx playwright install --with-deps chromium
      - name: Unlock a real encrypted cipher with PIN and pattern
        env:
          KOMBOE_BIN: server/upstream/target/debug/vaultwarden
          KOMBOE_SHOTS: ${{ github.workspace }}/angular-shots
        run: node tests/features/angular_vault_unlock.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-vault-screenshots
          path: angular-shots/*

  extension:
    # Builds the Chromium MV3 zip inside the existing clients image and uploads it.
    # Does not push to GHCR and does not publish a store listing.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the clients image without pushing it
        run: |
          set -eu
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f docker/Dockerfile.clients \
            --build-context komboe_root=. \
            --build-arg KOMBOE_REVISION="${{ github.sha }}" \
            -t komboe-clients:ci \
            clients/upstream
          cid=$(docker create komboe-clients:ci)
          mkdir -p dist
          docker cp "$cid:/opt/komboe-chrome-mv3.zip" dist/komboe-chrome-mv3.zip
          docker cp "$cid:/src/apps/web/build/komboe-downloads.json" dist/komboe-downloads.json
          docker rm "$cid"
          python3 - << 'PY'
          import hashlib, json
          from pathlib import Path
          blob = Path("dist/komboe-chrome-mv3.zip").read_bytes()
          manifest = json.loads(Path("dist/komboe-downloads.json").read_text())
          if manifest.get("revision") != "${{ github.sha }}":
              raise SystemExit(f"manifest revision is not this commit: {manifest.get('revision')}")
          asset = next(item for item in manifest["assets"] if item["id"] == "extension-chromium-mv3")
          digest = hashlib.sha256(blob).hexdigest()
          if asset["sha256"] != digest or asset["status"] != "published":
              raise SystemExit(f"manifest does not match the zip: {asset}")
          for other in manifest["assets"]:
              if other["id"] == "extension-chromium-mv3":
                  continue
              if other["sha256"] or other["url"] or other["status"] == "published":
                  raise SystemExit(f"clients image manifest includes a file this image did not build: {other['id']}")
          print("extension", digest, asset["size"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: komboe-chrome-mv3
          path: dist/*

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, marketing, angular-vault, extension]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish server and clients images
        env:
          IMAGE_SHA: ${{ github.sha }}
        run: |
          set -eu
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          publish_one() {
            name="$1"
            shift
            meta="${name}-meta.json"
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --metadata-file "$meta" \
              --push \
              --label "org.opencontainers.image.revision=${IMAGE_SHA}" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              -t "ghcr.io/${owner}/${name}:${IMAGE_SHA}" \
              "$@"
            digest=$(jq -r '."containerimage.digest" // empty' "$meta")
            hex=${digest#sha256:}
            if [ -z "$hex" ] || [ "$hex" = "$digest" ]; then
              echo "buildx metadata for ${name}:" >&2
              cat "$meta" >&2 || true
              echo "buildx did not write a sha256 manifest digest" >&2
              exit 1
            fi
            echo "${name} sha256:${hex}" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "${name}_digest=${hex}" >> "$GITHUB_OUTPUT"
          }
          publish_one komboe-server -f docker/Dockerfile.server .
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            -f docker/Dockerfile.clients \
            --build-context komboe_root=. \
            --build-arg KOMBOE_REVISION="${IMAGE_SHA}" \
            -t komboe-clients:validate \
            clients/upstream
          cid=$(docker create komboe-clients:validate)
          mkdir -p dist
          docker cp "$cid:/src/apps/web/build/komboe-downloads.json" dist/komboe-downloads.json
          docker cp "$cid:/opt/komboe-chrome-mv3.zip" dist/komboe-chrome-mv3.zip
          docker rm "$cid"
          EXPECTED_REVISION="${IMAGE_SHA}" python3 - << 'PY'
          import hashlib, json, os
          from pathlib import Path
          manifest = json.loads(Path("dist/komboe-downloads.json").read_text())
          if manifest.get("revision") != os.environ["EXPECTED_REVISION"]:
              raise SystemExit(f"published clients image stamped {manifest.get('revision')}")
          blob = Path("dist/komboe-chrome-mv3.zip").read_bytes()
          asset = next(item for item in manifest["assets"] if item["id"] == "extension-chromium-mv3")
          if asset["sha256"] != hashlib.sha256(blob).hexdigest() or asset["status"] != "published":
              raise SystemExit(f"published image manifest does not match the zip: {asset}")
          for other in manifest["assets"]:
              if other["id"] == "extension-chromium-mv3":
                  continue
              if other["sha256"] or other["url"] or other["status"] == "published":
                  raise SystemExit(f"published image manifest includes a file this image did not build: {other['id']}")
          print("clients image revision", manifest["revision"])
          PY
          publish_one komboe-clients -f docker/Dockerfile.clients --build-arg KOMBOE_REVISION="${IMAGE_SHA}" --build-context komboe_root=. clients/upstream
          for name in komboe-server komboe-clients; do
            gh api --method PUT "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/${name}" -f visibility=public \
              || echo "package ${name} stayed private; Coolify needs a read token to pull it"
          done
