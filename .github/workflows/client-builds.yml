name: client-builds

on:
  pull_request:
  workflow_dispatch:

jobs:
  desktop-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Electron native libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libsecret-1-dev libxss1 rpm fakeroot dpkg
      - name: Build an unsigned Linux desktop package
        working-directory: clients/upstream
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -eu
          npm install -g npm@11.6.2
          npm ci
          npm run build:oss --workspace @bitwarden/desktop
          cd apps/desktop
          npx electron-builder --linux deb AppImage --x64 -p never
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-unsigned
          path: |
            clients/upstream/apps/desktop/dist/*.deb
            clients/upstream/apps/desktop/dist/*.AppImage

  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build an unsigned Windows desktop package
        working-directory: clients/upstream
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install -g npm@11.6.2
          npm ci
          npm run build:oss --workspace @bitwarden/desktop
          cd apps/desktop
          npx electron-builder --win --x64 -p never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-unsigned
          path: clients/upstream/apps/desktop/dist/*.exe

  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Production Android signing check
        id: sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            mkdir -p dist
            printf '%s\n' "No ANDROID_KEYSTORE_BASE64 secret is configured." > dist/android-signing-absent.txt
            printf '%s\n' "mobile/android-build.sh only runs :app:assembleFdroidDebug." >> dist/android-signing-absent.txt
            printf '%s\n' "A release APK was not built and a signing key was not created." >> dist/android-signing-absent.txt
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: android-actions/setup-android@v3
        if: steps.sign.outputs.present == 'true'
      - name: Build the F-Droid release APK when a keystore already exists
        if: steps.sign.outputs.present == 'true'
        run: |
          set -eu
          pin=$(cat mobile/ANDROID_UPSTREAM_PIN)
          git clone --depth 1 -b "$pin" https://github.com/bitwarden/android.git /tmp/bw-android
          python3 mobile/android_rebrand.py /tmp/bw-android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/komboe.keystore
          cd /tmp/bw-android
          ./gradlew --no-daemon :app:assembleFdroidRelease \
            -Pandroid.injected.signing.store.file=/tmp/komboe.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find app/build/outputs/apk -name '*.apk' ! -name '*debug*' -exec cp {} "$GITHUB_WORKSPACE/dist/" \;
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-status
          path: dist/*

  download-manifest:
    needs: [desktop-linux, desktop-windows, android-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: desktop-*
          path: gathered
          merge-multiple: true
      - name: Record checksums without publishing a download URL
        run: |
          set -eu
          mkdir -p dist
          if compgen -G "gathered/**/*.deb" > /dev/null || compgen -G "gathered/*.deb" > /dev/null; then
            deb=$(find gathered -name '*.deb' | head -1)
            cp "$deb" dist/komboe-desktop-amd64.deb
          fi
          if find gathered -name '*.AppImage' | grep -q .; then
            cp "$(find gathered -name '*.AppImage' | head -1)" dist/komboe-desktop-x86_64.AppImage
          fi
          if find gathered -name '*.exe' | grep -q .; then
            cp "$(find gathered -name '*.exe' | head -1)" dist/komboe-desktop-win-x64-setup.exe
          fi
          python3 scripts/build-downloads-manifest.py \
            --artifacts dist \
            --record-checksums \
            --out dist/komboe-downloads.json
          python3 - << 'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("dist/komboe-downloads.json").read_text())
          for asset in manifest["assets"]:
              if asset["url"] or asset["status"] == "published":
                  raise SystemExit(f"checksum job must not publish a URL: {asset['id']}")
              if asset["status"] == "checksum" and not asset["sha256"]:
                  raise SystemExit(f"checksum missing: {asset['id']}")
          print("checksum assets", [(a["id"], a["status"], a["sha256"]) for a in manifest["assets"]])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: komboe-downloads-checksums
          path: dist/komboe-downloads.json
