# RailYard verify pipeline (GitHub Actions is blocked by billing; CI runs on RailYard).
# Komboe has no root .github/workflows, so this mirrors the existing RailYard
# checks plus the upstream vaultwarden build.yml verify jobs (fmt, clippy,
# test, build) for the sqlite feature. No deploy steps, no secrets.
when:
  - event: [push, pull_request, manual]
    branch: [main, railyard/*]

steps:
  - name: shellcheck
    image: koalaman/shellcheck-alpine:stable
    commands:
      - shellcheck scripts/*.sh

  - name: license-check
    image: alpine/git
    commands:
      - apk add --no-cache bash grep >/dev/null
      - bash scripts/check-licenses.sh

  - name: node-test
    image: node:24-bookworm
    commands:
      - node --version
      - node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=junit.xml --test-reporter=lcov --test-reporter-destination=lcov.info tests/run/*.test.mjs
    reports:
      junit: junit.xml
      coverage: lcov.info

  - name: server-lint
    image: rust:1.99-bookworm
    commands:
      - cd server/upstream
      - rustup component add rustfmt clippy
      - cargo fmt --all -- --check
      - cargo clippy --features sqlite -- -D warnings

  - name: server-test
    image: rust:1.99-bookworm
    depends_on: [server-lint]
    commands:
      - cd server/upstream
      - cargo test --features sqlite

  - name: server-build
    image: rust:1.99-bookworm
    depends_on: [server-test]
    commands:
      - cd server/upstream
      - cargo build --release --features sqlite
      - mkdir -p ../../railyard-out && cp target/release/vaultwarden ../../railyard-out/komboe-server
    artifacts:
      - railyard-out/komboe-server
