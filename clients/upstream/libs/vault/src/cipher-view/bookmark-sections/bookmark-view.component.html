<section class="tw-mb-5 bit-compact:tw-mb-4">
  <bit-section-header>
    <h2 bitTypography="h6">{{ "bookmarkDetails" | i18n }}</h2>
  </bit-section-header>
  <bit-card>
    @if (url()) {
      <bit-form-field disableMargin>
        <bit-label>{{ "bookmarkUrl" | i18n }}</bit-label>
        <input readonly bitInput [value]="url()" aria-readonly="true" data-testid="bookmark-url" />
      </bit-form-field>
    }
  </bit-card>
</section>
