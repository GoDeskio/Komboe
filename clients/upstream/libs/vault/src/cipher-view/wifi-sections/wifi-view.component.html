<section class="tw-mb-5 bit-compact:tw-mb-4">
  <bit-section-header>
    <h2 bitTypography="h6">{{ "wifiDetails" | i18n }}</h2>
  </bit-section-header>
  <bit-card>
    @if (ssid()) {
      <bit-form-field>
        <bit-label>{{ "ssid" | i18n }}</bit-label>
        <input readonly bitInput [value]="ssid()" aria-readonly="true" data-testid="wifi-ssid" />
      </bit-form-field>
    }
    @if (password()) {
      <bit-form-field>
        <bit-label>{{ "password" | i18n }}</bit-label>
        <input
          readonly
          bitInput
          type="password"
          [value]="password()"
          aria-readonly="true"
          class="tw-font-mono"
          data-testid="wifi-password"
        />
        <button
          type="button"
          bitIconButton
          bitSuffix
          bitPasswordInputToggle
          data-testid="toggle-wifi-password"
        ></button>
      </bit-form-field>
    }
    @if (security()) {
      <bit-form-field>
        <bit-label>{{ "wifiSecurity" | i18n }}</bit-label>
        <input
          readonly
          bitInput
          [value]="security()"
          aria-readonly="true"
          data-testid="wifi-security"
        />
      </bit-form-field>
    }
    <bit-form-field disableMargin>
      <bit-label>{{ "hiddenNetwork" | i18n }}</bit-label>
      <input
        readonly
        bitInput
        [value]="hidden() ? 'Yes' : 'No'"
        aria-readonly="true"
        data-testid="wifi-hidden"
      />
    </bit-form-field>
  </bit-card>
</section>
